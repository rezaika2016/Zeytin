<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zeytin — Self test</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <style>
        body { padding: 2rem; max-width: 60rem; margin: 0 auto; }
        .case { padding: .375rem 0; border-bottom: 1px solid var(--border); font-size: .8125rem; }
        .case b { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
        #summary { font-size: 1.125rem; font-weight: 700; margin: 1rem 0; }
    </style>
</head>
<body>

<h1>Zeytin — self test</h1>
<p class="muted">
    Menguji invarian perhitungannya, bukan tampilannya. Buka berkas ini lewat
    server (bukan <code>file://</code>) — modul ES tidak bisa dimuat dari berkas
    langsung. Halaman ini tidak menyentuh basis data sama sekali.
</p>

<div id="summary">…</div>
<div id="out"></div>

<script type="module">
import { dayFigures, periodReport, groupByMonth, groupByYear, lineTotal, isSettled } from './assets/js/ledger.js';
import { parseMoney, excelSerialToDate, eachDate, dateKey, money } from './assets/js/util.js';
import { SUPPLIER_CASH_OPENING, CHANNELS, ALLOWED_EMAILS } from './assets/js/config.js';
import { DICTIONARIES } from './assets/js/i18n.js';
import { toDate, stableId, SPECS, templateHeader } from './assets/js/pages/import.js';
import { SCHEMAS, comboOptions, masterMatch } from './assets/js/schema.js';
import { COLLECTIONS } from './assets/js/store.js';

const out = document.getElementById('out');
let pass = 0;
let fail = 0;

function check(name, actual, expected) {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    ok ? pass++ : fail++;

    out.insertAdjacentHTML('beforeend',
        `<div class="case"><b class="${ok ? 'pos' : 'neg'}">${ok ? 'PASS' : 'FAIL'}</b> — ${name}` +
        (ok ? '' : `<br><span class="muted">dapat ${JSON.stringify(actual)}, harusnya ${JSON.stringify(expected)}</span>`) +
        `</div>`);
}

/* ---------------------------------------------------------- uang & tanggal */

check('parseMoney membaca berbagai bentuk ketikan',
    ['45.000', '45000', 'Rp 45.000', 45000, '', null].map(parseMoney),
    [45000, 45000, 45000, 45000, 0, 0]);

check('serial Excel 46235 = 1 Agustus 2026', excelSerialToDate(46235), '2026-08-01');
check('serial Excel 46265 = 31 Agustus 2026', excelSerialToDate(46265), '2026-08-31');
check('serial tidak masuk akal ditolak', excelSerialToDate(0), '');

check('eachDate mencakup kedua ujungnya',
    eachDate('2026-08-30', '2026-09-01'),
    ['2026-08-30', '2026-08-31', '2026-09-01']);

check('rentang terbalik jadi satu hari, bukan kosong',
    eachDate('2026-09-05', '2026-09-01'),
    ['2026-09-05']);

check('dateKey memakai waktu lokal, bukan UTC',
    dateKey(new Date(2026, 7, 1, 23, 30)), '2026-08-01');

check('rupiah negatif diberi tanda di depan', money(-12500), '-Rp 12.500');

/* --------------------------------------------- konsep kolom berkas Excel */

const day = dayFigures({
    date: '2026-08-01',
    pettyCash: 100000,
    cash: 4606678,
    bni: 1325940,
    grabFood: 0,
    goFood: 0,
    goPay: 0,
}, 1366000);

check('Total Sales = SUM(D:H), petty cash TIDAK ikut',
    day.totalSales, 4606678 + 1325940);

check('Grand Income = Total Sales - cash (nontunai)',
    day.cashless, 1325940);

check('Supplier Cash = 456560 + cash',
    day.supplierCash, SUPPLIER_CASH_OPENING + 4606678);

check('Remaining Supplier Cash = Supplier Cash - belanja',
    day.remainingSupplierCash, SUPPLIER_CASH_OPENING + 4606678 - 1366000);

check('sisa titipan boleh minus',
    dayFigures({ cash: 100000 }, 900000).remainingSupplierCash,
    SUPPLIER_CASH_OPENING + 100000 - 900000);

check('total satu baris belanja = (qty*price) + tax - disc',
    lineTotal({ qty: 3, price: 12000, tax: 1000, disc: 500 }), 36500);

check('hari kosong menghasilkan nol, bukan NaN',
    dayFigures({}, 0).totalSales, 0);

/* ------------------------------------------------------------- periode */

const data = {
    days: [
        { date: '2026-08-01', cash: 1000000, bni: 500000, pettyCash: 50000 },
        { date: '2026-08-02', cash: 2000000, grabFood: 300000 },
        { date: '2026-09-01', cash: 1500000, goPay: 200000 },
    ],
    expenses: [
        { date: '2026-08-01', total: 400000 },
        { date: '2026-08-01', total: 100000 },
        { date: '2026-09-01', total: 250000 },
    ],
    transfers: [{ date: '2026-08-05', total: 3000000 }],
    payroll: [{ month: '2026-08', grandTotal: 5000000 }],
    outstanding: [
        { date: '2026-08-10', total: 750000, status: 'Need the payment' },
        { date: '2026-08-11', total: 999000, status: 'PT KEBAP PAID' },
    ],
};

const aug = periodReport(data, '2026-08-01', '2026-08-31');

check('penjualan dijumlahkan sepanjang rentang',
    aug.totalSales, 1500000 + 2300000);

check('petty cash tidak ikut total, tapi tetap tercatat per channel',
    [aug.totalSales, aug.byChannel.pettyCash], [3800000, 50000]);

// Pemasukan nontunai ditentukan dari penanda `isCash` di config.js, bukan
// dengan menyebut nama channel satu-satu di ledger.js. BNI, Grab Food, Go
// Food, dan Go Pay harus otomatis masuk nontunai — begitu pula channel baru
// yang ditambahkan nanti, tanpa perlu mengubah rumus ini lagi.
check('nontunai = semua channel penjualan yang tidak ditandai isCash',
    dayFigures({ date: '2026-08-01', cash: 1000000, bni: 200000, grabFood: 50000, goFood: 30000, goPay: 20000, pettyCash: 999999 }, 0).cashless,
    200000 + 50000 + 30000 + 20000);

check('tepat satu channel penjualan ditandai tunai',
    CHANNELS.filter((c) => c.inSales && c.isCash).length, 1);

check('belanja dikelompokkan per tanggal — tidak ada baris yang luput',
    aug.cashExpense, 500000);

check('transfer pemasok ikut dihitung sebagai pengeluaran',
    aug.transfers, 3000000);

check('gaji ikut dihitung sebagai pengeluaran',
    aug.payroll, 5000000);

check('laba bersih = penjualan - (belanja + transfer + gaji)',
    aug.netProfit, 3800000 - (500000 + 3000000 + 5000000));

check('tagihan yang sudah lunas tidak dihitung sebagai utang',
    aug.outstanding, 750000);

check('saldo global = laba - tagihan belum dibayar',
    aug.globalBalance, aug.netProfit - aug.outstanding);

// Sisa titipan berisi `456.560 + tunai`, jadi menambahkannya ke saldo global
// membuat uang tunai terhitung dua kali: pemasukan tunai 5 juta pernah muncul
// sebagai saldo 10,4 juta di layar klien.
const tunaiSaja = periodReport({
    days: [{ date: '2026-08-01', cash: 5000000 }],
    expenses: [], transfers: [], payroll: [], outstanding: [],
}, '2026-08-01', '2026-08-01');

check('uang tunai tidak dihitung dua kali di saldo global',
    [tunaiSaja.totalSales, tunaiSaja.globalBalance], [5000000, 5000000]);

check('sisa titipan tetap ditampilkan terpisah, tidak ikut saldo global',
    tunaiSaja.remainingSupplierCash, SUPPLIER_CASH_OPENING + 5000000);

check('sisa titipan adalah keadaan hari terakhir, bukan jumlah antar hari',
    aug.remainingSupplierCash,
    SUPPLIER_CASH_OPENING + 2000000 - 0);

check('hari di luar rentang tidak ikut terhitung',
    periodReport(data, '2026-08-01', '2026-08-01').totalSales, 1500000);

check('hari tanpa penjualan tetap muncul sebagai baris nol',
    aug.rows.length, 31);

check('jumlah hari yang benar-benar tercatat dihitung terpisah',
    aug.recordedDays, 2);

/* -------------------------------------------------- pengelompokan periode */

const wide = periodReport(data, '2026-08-01', '2026-09-30');
const months = groupByMonth(wide.rows);
const years = groupByYear(wide.rows);

check('pengelompokan bulanan memisahkan bulan dengan benar',
    months.map((m) => [m.key, m.totalSales]),
    [['2026-08', 3800000], ['2026-09', 1700000]]);

check('bulanan dan harian menghasilkan total yang sama',
    months.reduce((s, m) => s + m.totalSales, 0), wide.totalSales);

check('tahunan dan harian menghasilkan total yang sama',
    years.reduce((s, y) => s + y.totalSales, 0), wide.totalSales);

check('tiap channel juga cocok antara bulanan dan keseluruhan',
    CHANNELS.map((c) => months.reduce((s, m) => s + m[c.key], 0)),
    CHANNELS.map((c) => wide.byChannel[c.key]));

/* ------------------------------------------------------------- status */

check('status lunas dikenali apa pun ejaannya',
    ['PT KEBAP PAID', 'Aslan Paid', 'lunas', 'settled', 'Need the payment', ''].map(isSettled),
    [true, true, true, true, false, false]);

/* --------------------------------------------------------- dua bahasa */

// Kunci yang belum diterjemahkan tidak kelihatan saat dipakai — ia diam-diam
// jatuh ke bahasa Inggris. Membandingkan kedua kamus satu-satunya cara
// menangkapnya sebelum staf melihat kalimat Inggris di tengah halaman
// berbahasa Indonesia.
const enKeys = Object.keys(DICTIONARIES.en).sort();
const idKeys = Object.keys(DICTIONARIES.id).sort();

check('tiap kunci Inggris punya terjemahan Indonesia',
    enKeys.filter((k) => !(k in DICTIONARIES.id)), []);

check('tidak ada kunci Indonesia yang tidak dipakai',
    idKeys.filter((k) => !(k in DICTIONARIES.en)), []);

check('tidak ada terjemahan yang kosong',
    idKeys.filter((k) => !String(DICTIONARIES.id[k]).trim()), []);

/* ------------------------------------------- tanggal ketikan tangan */

// Di berkas klien, tanggal enam belas hari pertama berupa serial Excel,
// sisanya diketik tangan sebagai teks "31/08/2026". Date.parse menolak
// bentuk itu, dan baris yang tanggalnya ditolak mewarisi tanggal baris
// sebelumnya — jadi belanja setengah bulan menumpuk di satu hari tanpa
// galat apa pun. Uji ini ada supaya bentuk itu tidak pernah lolos lagi.

check('tanggal ketikan tangan dibaca hari-dulu',
    ['31/08/2026', '5/8/2026', '17/8/2026', '1.9.2026'].map(toDate),
    ['2026-08-31', '2026-08-05', '2026-08-17', '2026-09-01']);

check('serial Excel tetap terbaca seperti semula', toDate(46235), '2026-08-01');

check('tanggal ISO dibiarkan apa adanya', toDate('2026-08-09'), '2026-08-09');

check('bulan mustahil ditolak, bukan digeser ke bulan berikutnya',
    ['31/13/2026', '0/8/2026', '32/8/2026'].map(toDate), ['', '', '']);

check('sel kosong tidak jadi tanggal hari ini', [toDate(''), toDate(null)], ['', '']);

/* ------------------------------------------- nomor identitas impor */

// Sebelum ini tiap baris impor diberi nomor acak, jadi mengimpor berkas yang
// sama dua kali menggandakan seluruh isinya tanpa tanda apa pun. Uji berikut
// mengunci perilaku yang menggantikannya.

const KEY = ['date', 'vendor', 'item', 'qty', 'price'];
const ROW = { date: '2026-08-01', vendor: 'Anadolu Meat', item: 'Lamb shank', qty: 2, price: 50000 };

check('baris yang isinya sama selalu dapat nomor yang sama',
    stableId(KEY, ROW, {}), stableId(KEY, ROW, {}));

check('satu isi berubah, nomornya ikut berubah',
    stableId(KEY, ROW, {}) === stableId(KEY, { ...ROW, price: 60000 }, {}), false);

check('baris kembar dalam satu impor tetap jadi dua baris', (() => {
    const seen = {};

    return stableId(KEY, ROW, seen) === stableId(KEY, ROW, seen);
})(), false);

check('urutan baris kembar sama tiap kali diimpor', (() => {
    const first = {};
    const second = {};

    return [stableId(KEY, ROW, first), stableId(KEY, ROW, first)].join()
        === [stableId(KEY, ROW, second), stableId(KEY, ROW, second)].join();
})(), true);

check('baris tanpa isi sama sekali tidak dapat nomor', stableId(KEY, {}, {}), '');

check('nomornya aman dipakai sebagai id Firestore',
    /^[a-z0-9-]+$/.test(stableId(KEY, { ...ROW, item: 'Ayam / Sapi (1kg)' }, {})), true);

/* ------------------------------------------------------------- akses */

check('daftar email yang diizinkan tidak kosong dan huruf kecil semua',
    ALLOWED_EMAILS.length > 0 && ALLOWED_EMAILS.every((e) => e === e.toLowerCase() && e.includes('@')),
    true);

// Daftarnya ada di dua berkas, dan keduanya harus sama persis. Kalau satu
// alamat ditambahkan di config.js saja, orangnya bisa masuk lalu melihat
// aplikasi yang tidak memuat apa pun — Firestore menolaknya di sisi server,
// dan pesannya tidak menjelaskan sebabnya. Kebalikannya juga buruk: alamat
// yang cuma ada di firestore.rules tidak akan pernah bisa menekan tombol
// masuk. Satu-satunya cara menangkapnya adalah membandingkan keduanya.
const rulesText = await fetch('./firestore.rules').then((r) => r.text());
const emailsInRules = [...rulesText.matchAll(/'([^'\s]+@[^'\s]+)'/g)].map((m) => m[1]).sort();

check('daftar email di firestore.rules sama persis dengan config.js',
    emailsInRules, [...ALLOWED_EMAILS].sort());

/* ------------------------------------------------- data induk & saran */

const COMBO = { name: 'item', source: 'products', fills: { unit: 'unit', price: 'price' } };
const MASTER_ROWS = {
    products: [
        { name: 'Yoghurt 5kg', unit: 'pack', price: 85000 },
        { name: 'Bulgur sack', unit: 'sack', price: 320000 },
    ],
};

check('saran menggabungkan data induk dengan yang sudah pernah dipakai',
    comboOptions(COMBO, MASTER_ROWS, [{ item: 'Tomato crate' }, { item: 'yoghurt 5kg' }]),
    ['Bulgur sack', 'Tomato crate', 'Yoghurt 5kg']);

check('nilai kosong tidak ikut jadi saran',
    comboOptions(COMBO, {}, [{ item: '' }, { item: null }, { item: '  ' }]), []);

check('induk dicocokkan tanpa memandang huruf besar-kecil dan spasi',
    masterMatch(COMBO, MASTER_ROWS, '  yoghurt 5KG ').price, 85000);

check('yang tidak terdaftar tidak dicocokkan dengan yang sekadar mirip',
    masterMatch(COMBO, MASTER_ROWS, 'Yoghurt'), null);

// Tiga uji berikut menjaga sambungan antarberkas. Salah satunya putus tidak
// memunculkan galat apa pun — kotak sarannya cuma diam-diam kosong, atau
// simpanannya ditolak Firestore tanpa sebab yang jelas.

check('tiap kotak saran menunjuk koleksi induk yang benar-benar ada',
    Object.values(SCHEMAS).flatMap((s) => s.fields)
        .filter((f) => f.type === 'combo' && !(SCHEMAS[f.source] || {}).master)
        .map((f) => String(f.source)), []);

check('kolom yang diisi otomatis benar-benar ada di formulirnya',
    Object.values(SCHEMAS).flatMap((s) => s.fields
        .flatMap((f) => Object.keys(f.fills || {})
            .filter((target) => !s.fields.some((other) => other.name === target))
            .map((target) => `${s.key}.${target}`))), []);

check('tiap koleksi di skema dikenal oleh store',
    Object.keys(SCHEMAS).filter((key) => !(key in COLLECTIONS)), []);

check('tiap koleksi punya aturan Firestore-nya sendiri',
    Object.keys(COLLECTIONS).filter((name) => !rulesText.includes(`match /${name}/`)), []);

/* ---------------------------------------------------------- template */

// Template yang judul kolomnya tidak dikenali pembacanya sama saja dengan
// tidak punya template: berkasnya tetap ditolak saat diunggah. Dicocokkan
// dengan cara yang sama seperti findHeaderRows, yaitu setelah dinormalkan.
const normalize = (value) => String(value ?? '').trim().toLowerCase().replace(/\s+/g, ' ');

check('header template memuat semua kolom wajib tiap sheet',
    SPECS.flatMap((spec) => {
        const header = templateHeader(spec).map(normalize);

        return spec.required.filter((label) => !header.includes(label))
            .map((label) => `${spec.sheet}: ${label}`);
    }), []);

check('header template memuat tiap kolom yang dipetakan',
    SPECS.flatMap((spec) => {
        const header = templateHeader(spec).map(normalize);

        return Object.entries(spec.map)
            .filter(([, aliases]) => !aliases.some((alias) => header.includes(alias)))
            .map(([field]) => `${spec.sheet}.${field}`);
    }), []);

check('template tidak punya judul kolom kembar',
    SPECS.flatMap((spec) => {
        const header = templateHeader(spec).map(normalize);

        return header.filter((label, i) => header.indexOf(label) !== i)
            .map((label) => `${spec.sheet}: ${label}`);
    }), []);

/* ------------------------------------------------------------ ringkasan */

const summary = document.getElementById('summary');
summary.textContent = fail === 0
    ? `SEMUA LOLOS — ${pass} uji`
    : `${fail} GAGAL, ${pass} lolos`;
summary.className = fail === 0 ? 'pos' : 'neg';
document.title = fail === 0 ? `PASS ${pass}` : `FAIL ${fail}`;
</script>

</body>
</html>
